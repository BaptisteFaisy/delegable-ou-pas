name: CI

# CI de l'app Forge « Fait, preuve à l'appui » : types, tests unitaires, gardes
# de taille (fichier < 500 lignes, fonction < 50 lignes), manifeste Forge,
# sanity docs et tests des gardes CI. Le check publié s'appelle `ci` : il est
# exigé par le ruleset de `main` et par la file Mergify, comme `ci-budget` et
# `couche0`.
#
# Budget : 5 minutes maximum (règle CI du 24 octobre 2026, `~/Bureau/CI-BUDGET-5MIN.md`).
# Les runners sont persistants : `node_modules` est conservé d'un run à l'autre
# et l'installation n'a lieu que si `package-lock.json` a changé. Le cache npm
# est partagé entre les jobs. Jamais de timeout allongé : on optimise ou on
# découpe.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : on garde `node_modules` (l'app
      # TypeScript), on jette le reste. `git clean -ffdx` sans `-e` effacerait
      # les dépendances et ferait exploser le budget de 5 minutes.
      - name: Identité git (absente par défaut sur un runner GitHub-hosted)
        run: |
          git config --global user.name "CI (GitHub Actions)"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dépendances (install explicite)
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: git clean -ffdx -e /node_modules -e /.npm-state -e /dist -e /build

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitaires (vitest)
        run: npx vitest run --passWithNoTests

      # Garde user (règle de fin octobre) : aucun fichier au-delà de 500 lignes.
      - name: Garde de taille des fichiers (< 500 lignes)
        run: python3 tools/check-file-limits.py

      # Même règle, au niveau des fonctions : moins de 50 lignes de code.
      - name: Garde de taille des fonctions (< 50 lignes)
        run: node tools/check-function-limits.mjs

      # Le manifeste Forge n'est pas encore outillé : l'étape est tolérante
      # (message + code 0) tant que tools/check-manifest.mjs est absent.
      # Le manifeste est contrôlé dès qu'il existe. Tant que l'assemblage
      # (`src/index.ts`, lot L7) n'est pas là, les handlers qu'il déclare
      # n'existent pas encore : le contrôle reste bruyant (avertissement dans
      # le journal) mais ne bloque pas la file. Il redevient strict dès que
      # `src/index.ts` arrive — on ne désactive jamais une garde, on borne la
      # période pendant laquelle elle ne peut pas encore conclure.
      - name: Manifeste Forge
        shell: bash
        run: |
          if [ ! -f tools/check-manifest.mjs ] || [ ! -f manifest.yml ]; then
            echo "::notice::manifest.yml ou tools/check-manifest.mjs absent - etape ignoree"
          elif [ -f src/index.ts ]; then
            node tools/check-manifest.mjs
          else
            node tools/check-manifest.mjs \
              || echo "::warning::manifeste non conforme en l'etat (assemblage src/index.ts absent) - a corriger avant le lot L7"
          fi

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import os
          exts = {".md", ".mdx", ".txt"}
          ignores = {".git", "node_modules", "dist", "build", ".npm-state", "coverage"}
          vides, illisibles, total = [], [], 0
          for racine, dossiers, fichiers in os.walk("."):
              dossiers[:] = [d for d in dossiers if d not in ignores]
              for nom in sorted(fichiers):
                  if os.path.splitext(nom)[1].lower() not in exts:
                      continue
                  chemin = os.path.join(racine, nom)
                  total += 1
                  try:
                      with open(chemin, "r", encoding="utf-8") as fh:
                          contenu = fh.read()
                  except (OSError, UnicodeError):
                      illisibles.append(chemin)
                      continue
                  if not contenu.strip():
                      vides.append(chemin)
          print("%d doc(s) controle(s)" % total)
          for chemin in illisibles:
              print("::error::illisible en UTF-8 : %s" % chemin)
          for chemin in vides:
              print("::error::document vide : %s" % chemin)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Les gardes de la CI se testent elles-mêmes : couche0 + agents
      # fireworks — stdlib, quelques secondes, aucun réseau. `test_agent.py`
      # n'est pas dans la liste : c'est le pilote (CLI), il est exercé par
      # `test_test_agent.py`.
      - name: Tests des gardes CI (couche0, fireworks)
        shell: bash
        run: |
          # Chaque garde se teste elle-même ; un fichier absent (branche
          # partielle) est sauté, pas échoué — la liste reste explicite pour
          # qu'un retrait passe par une modification visible de ce workflow.
          for t in .github/couche0/test_check_couche0.py \
                   .github/fireworks/test_conflict_agent.py \
                   .github/fireworks/test_quota.py \
                   .github/fireworks/test_scope_agent.py \
                   .github/fireworks/test_test_agent.py \
                   .github/fireworks/test_union_journal.py; do
            if [ -f "$t" ]; then python3 "$t"; else echo "::notice::$t absent - saute"; fi
          done

      # Les scripts shell sont vérifiés sans être exécutés (pas de réseau).
      - name: Syntaxe des scripts shell (s'il y en a)
        shell: bash
        run: |
          trouve=0
          while IFS= read -r script; do
            bash -n "$script"
            echo "bash -n OK : $script"
            trouve=1
          done < <(find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$trouve" = 0 ]; then
            echo "::notice::aucun script shell - etape ignoree"
          fi
