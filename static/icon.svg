<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Délégable ou pas">
  <rect width="64" height="64" rx="12" fill="#0B1B2B"/>
  <!-- Les quatre couleurs de la carte de délégation (SPEC §12) : vert = à
       confier, orange = relecture renforcée, rouge = à garder, gris = on ne
       sait pas. Le gris a la même taille que les autres : « on ne sait pas »
       est une conclusion à part entière (SPEC §7, règle 4). -->
  <circle cx="20" cy="20" r="8" fill="#36B37E"/>
  <circle cx="44" cy="20" r="8" fill="#FF991F"/>
  <circle cx="20" cy="44" r="8" fill="#DE350B"/>
  <circle cx="44" cy="44" r="8" fill="#97A0AF"/>
  <path d="M12 54h40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
